<meta charset="utf-8">
<!--
  DUETO — folha de letras para cantar em dupla
  ---------------------------------------------
  • As LETRAS ficam em songs/*.md (você preenche). O diff no GitHub fica limpo.
  • As CORES ficam aqui, no objeto VOICES / nas variáveis --voice-*. Editar letra nunca mexe em cor.
  • A ordem das músicas vem de songs.json.

  Convenção do Markdown (dentro de cada songs/*.md):
    # Título da música
    ## Nome da seção (Refrão, Verso 1, Ponte...)
    [A]  linha do cantor A
    [B]  linha do cantor B
    [AB] linha dos dois
  Linha sem marca = ambos.

  Extras:
    [AB>A]  ambos cantam, A na 1ª voz (melodia) / B na 2ª voz (harmonia) — rótulo mostra quem faz a 2ª voz. Também aceita [AB>B].
    ~[B] texto   contra-canto: linha colada na linha ANTERIOR, cantada em paralelo (não é a próxima frase).
                 Renderiza recuada, menor e em itálico. Aceita ~[A], ~[B], ~[AB].
    ^palavra     (colado, sem espaço) melodia sobe nessa palavra → ↑palavra
    _palavra     (colado, sem espaço) melodia desce nessa palavra → ↓palavra

  Para ver no tablet: ligue o GitHub Pages no repo e abra a URL.
  Para testar localmente: rode  python3 -m http.server  nesta pasta e abra http://localhost:8000
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Figtree:wght@400;500;600&display=swap');

  :root {
    --bg: #14131a; --surface: #1e1c26; --rule: rgba(255,255,255,.09);
    --text: #ecebf2; --muted: #8a8698;

    /* Cores dos cantores — mude aqui à vontade */
    --voice-a: #ffb454;   /* quente */
    --voice-b: #4fd6c9;   /* frio  */
    --voice-ab: #c9a8ff;  /* os dois */

    --lyric-size: 30px;
    --display: 'Fraunces', Georgia, serif;
    --body: 'Figtree', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--body); -webkit-font-smoothing: antialiased; line-height: 1.5; }

  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: rgba(20,19,26,.86); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--rule);
    padding: 14px clamp(16px,4vw,40px);
    display: flex; flex-wrap: wrap; align-items: center; gap: 14px 20px;
  }
  .brand { font-family: var(--display); font-weight: 600; font-size: 20px; letter-spacing: .5px; margin-right: auto; }
  .brand span { color: var(--voice-a); }
  .brand em { color: var(--voice-b); font-style: normal; }

  .picker { background: var(--surface); color: var(--text); border: 1px solid var(--rule); border-radius: 10px; padding: 9px 12px; font-family: var(--body); font-size: 15px; max-width: 60vw; }
  .legend { display: flex; gap: 14px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; color: var(--muted); }
  .dot { width: 12px; height: 12px; border-radius: 4px; }
  .sizer { display: flex; gap: 6px; }
  .sizer button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--rule); background: var(--surface); color: var(--text); font-family: var(--display); font-size: 17px; cursor: pointer; }
  .sizer button:hover { border-color: var(--muted); }
  .sizer button:focus-visible, .picker:focus-visible { outline: 2px solid var(--voice-b); outline-offset: 2px; }

  main { max-width: 820px; margin: 0 auto; padding: clamp(24px,5vw,56px) clamp(16px,4vw,40px) 120px; }
  .song-title { font-family: var(--display); font-weight: 600; font-size: clamp(30px,6vw,46px); line-height: 1.1; margin: 0 0 6px; }
  .song-sub { color: var(--muted); font-size: 15px; margin: 0 0 40px; }

  .section { margin-bottom: 34px; }
  .section-label { font-family: var(--display); font-style: italic; font-weight: 500; font-size: 15px; letter-spacing: .3px; color: var(--muted); text-transform: lowercase; margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--rule); }

  .line { display: flex; align-items: stretch; gap: 16px; padding: 5px 0; }
  .ribbon { width: 5px; border-radius: 3px; flex: none; }
  .r-a { background: var(--voice-a); }
  .r-b { background: var(--voice-b); }
  .r-ab { background: linear-gradient(var(--voice-a) 0 50%, var(--voice-b) 50% 100%); }
  .words { font-size: var(--lyric-size); font-weight: 500; line-height: 1.32; letter-spacing: .2px; }
  .t-a { color: var(--voice-a); }
  .t-b { color: var(--voice-b); }
  .t-ab { color: var(--voice-ab); }

  .notice { max-width: 640px; margin: 8vh auto; padding: 0 24px; color: var(--muted); font-size: 17px; line-height: 1.6; }
  .notice strong { color: var(--text); }
  .notice code { background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 2px 7px; font-size: 15px; color: var(--voice-b); }

  .lead-tag { display: block; font-family: var(--display); font-style: italic; font-weight: 500; font-size: 13px; color: var(--muted); margin-bottom: 2px; }
  .pitch { font-size: .72em; color: var(--muted); margin-right: 1px; }

  .line.counter { margin: -6px 0 5px 40px; }
  .line.counter .ribbon { width: 3px; }
  .words.counter-text { font-size: calc(var(--lyric-size) * .62); font-style: italic; opacity: .82; }

  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
  @media (max-width: 520px) { .legend { order: 3; width: 100%; } .brand { font-size: 18px; } .picker { max-width: 100%; } }
</style>

<div class="topbar">
  <div class="brand"><span>DU</span><em>ETO</em></div>
  <select class="picker" id="picker" aria-label="Escolher música"></select>
  <div class="legend" id="legend"></div>
  <div class="sizer">
    <button id="minus" aria-label="Diminuir a letra">A−</button>
    <button id="plus" aria-label="Aumentar a letra">A+</button>
  </div>
</div>

<main id="stage"></main>

<script>
  // ── Config dos cantores: nome + cor (classe). Só mexer aqui pra renomear/recolorir.
  const VOICES = {
    A:  { name: 'Daniel',  cls: 'a'  },
    B:  { name: 'Ícaro', cls: 'b'  },
    AB: { name: 'Ambos', cls: 'ab' },
  };

  const stage  = document.getElementById('stage');
  const picker = document.getElementById('picker');
  let songs = [];

  document.getElementById('legend').innerHTML = Object.values(VOICES).map(v =>
    `<span class="chip"><span class="dot" style="background:var(--voice-${v.cls})"></span>${v.name}</span>`
  ).join('');

  function parse(md) {
    const s = { title: 'Sem título', sections: [] };
    let section = null;
    for (const raw of md.split('\n')) {
      const t = raw.trim();
      if (!t || t.startsWith('<!--') || t.startsWith('-->')) continue;
      if (t.startsWith('# ')) { s.title = t.slice(2).trim(); continue; }
      if (t.startsWith('## ')) { section = { label: t.slice(3).trim(), lines: [] }; s.sections.push(section); continue; }
      if (!section) continue;
      const m = t.match(/^(~)?\[([A-Za-z]+)(?:>([A-Za-z]+))?\]\s*(.*)$/);
      const isCounter = !!(m && m[1]);
      const code = m ? m[2].toUpperCase() : 'AB';
      const lead = m && m[3] ? m[3].toUpperCase() : null;
      const text = m ? m[4] : t;
      if (isCounter) {
        const prev = section.lines[section.lines.length - 1];
        if (prev) prev.counter = { code, text };
      } else {
        section.lines.push({ code, lead, text });
      }
    }
    return s;
  }

  // ^palavra (colado) = sobe · _palavra (colado) = desce
  const ARROW_UP = '↑', ARROW_DOWN = '↓';
  function renderPitch(text) {
    return text
      .replace(/_(?=\S)/g, `<span class="pitch">${ARROW_DOWN}</span>`)
      .replace(/\^(?=\S)/g, `<span class="pitch">${ARROW_UP}</span>`);
  }

  function lineHtml(ln, isCounter) {
    const v = VOICES[ln.code] || VOICES.AB;
    const second = ln.lead === 'A' ? 'B' : ln.lead === 'B' ? 'A' : null;
    const lead = second && VOICES[second] ? `<span class="lead-tag">2ª: ${VOICES[second].name}</span>` : '';
    const wordsCls = isCounter ? `words t-${v.cls} counter-text` : `words t-${v.cls}`;
    return `<div class="line${isCounter ? ' counter' : ''}"><div class="ribbon r-${v.cls}"></div><div class="${wordsCls}">${lead}${renderPitch(ln.text)}</div></div>`;
  }

  function render(i) {
    const s = songs[i];
    let html = `<h1 class="song-title">${s.title}</h1>
      <p class="song-sub">${VOICES.A.name} · ${VOICES.B.name} · juntos em <strong>Ambos</strong></p>`;
    for (const sec of s.sections) {
      html += `<section class="section"><p class="section-label">${sec.label}</p>`;
      for (const ln of sec.lines) {
        html += lineHtml(ln, false);
        if (ln.counter) html += lineHtml(ln.counter, true);
      }
      html += `</section>`;
    }
    stage.innerHTML = html;
    window.scrollTo(0, 0);
  }

  async function boot() {
    try {
      const list = await (await fetch('songs.json')).json();
      songs = await Promise.all(list.map(async f => parse(await (await fetch(f)).text())));
      songs.forEach((s, i) => { const o = document.createElement('option'); o.value = i; o.textContent = s.title; picker.appendChild(o); });
      picker.addEventListener('change', () => render(Number(picker.value)));
      render(0);
    } catch (e) {
      stage.innerHTML = `<div class="notice">
        <strong>Não consegui carregar as letras.</strong><br><br>
        O navegador bloqueia a leitura de arquivos locais abertos direto (<code>file://</code>). Sirva a pasta:<br><br>
        No tablet → ligue o <strong>GitHub Pages</strong> no repositório e abra a URL.<br>
        No computador → rode <code>python3 -m http.server</code> nesta pasta e abra <code>http://localhost:8000</code>.
      </div>`;
    }
  }
  boot();

  let size = 30;
  const apply = () => document.documentElement.style.setProperty('--lyric-size', size + 'px');
  document.getElementById('plus').onclick  = () => { size = Math.min(60, size + 3); apply(); };
  document.getElementById('minus').onclick = () => { size = Math.max(18, size - 3); apply(); };
</script>
